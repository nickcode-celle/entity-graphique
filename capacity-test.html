<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENTITY Capacity Test</title><style>html,body{margin:0;background:#000;color:#fff;font-family:system-ui}#panel{position:fixed;z-index:20;top:12px;left:12px;background:#000b;padding:10px;border-radius:8px}button{margin:3px;padding:7px 9px}#fps{font-weight:700;margin-top:7px}</style></head><body><div id="panel"><div>ENTITY — test capacité</div><div id="buttons"></div><div id="fps">FPS: …</div></div><script>const counts=[300,500,750,1000,1500,2000],q=new URLSearchParams(location.search),n=Number(q.get('balls'))||1000,b=document.getElementById('buttons');for(const c of counts){const x=document.createElement('button');x.textContent=c;x.onclick=()=>location.href='capacity-test.html?balls='+c;b.appendChild(x)}let frames=0,last=performance.now();function tick(t){frames++;if(t-last>=1000){document.getElementById('fps').textContent='FPS: '+Math.round(frames*1000/(t-last))+' · '+n+' billes';frames=0;last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script><script type="module">import('/src/main-entity-50.js'+location.search)</script></body></html>
