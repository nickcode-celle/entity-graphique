<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REPOS</title>
  <style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#1d1f22}</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main-repos-transition-300.js"></script>
  <script>
    function forceValidatedRepos(){
      const rows=[...document.querySelectorAll('.controller')]
      const row=rows.find(r=>r.querySelector('.name')?.textContent.trim()==='SEPARATION')
      const input=row?.querySelector('input')
      if(!input)return false
      input.value='40'
      input.dispatchEvent(new Event('input',{bubbles:true}))
      input.dispatchEvent(new Event('change',{bubbles:true}))
      return true
    }
    let tries=0
    const timer=setInterval(()=>{tries++;if(forceValidatedRepos()||tries>80)clearInterval(timer)},50)
  </script>
</body>
</html>
