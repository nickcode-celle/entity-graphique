name: Patch golden marble birth effect

on:
  push:
    branches:
      - entity-new-marble-birth-v1
    paths:
      - .github/workflows/entity-new-marble-birth-patch.yml
      - tools/patch_new_marble_birth.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-new-marble-birth-v1
          fetch-depth: 0

      - name: Apply exact birth effect
        run: python3 tools/patch_new_marble_birth.py

      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build

      - name: Commit patched prototype
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Prototype light burst giving birth to golden marble"
          git push origin HEAD:entity-new-marble-birth-v1
