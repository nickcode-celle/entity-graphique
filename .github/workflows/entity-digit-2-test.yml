name: Build 300-ball digit 2 skeleton test

on:
  push:
    branches:
      - entity-digit-2-test-v1
    paths:
      - .github/workflows/entity-digit-2-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-digit-2-test-v1
          fetch-depth: 0
      - name: Replace digit 1 skeleton with digit 2 skeleton only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main-entity-50.js')
          s = p.read_text()
          start = s.index('function makeDigitOneCenters(){')
          end = s.index('\n\nconst personality=', start)
          digit = """function makeDigitTwoCenters(){
            const pts=[]
            function halton(i,b){let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b)}return r}
            function addStroke(count,ax,ay,bx,by,width,depth,offset){
              const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len
              for(let i=0;i<count;i++){
                const k=i+1+offset,t=halton(k,2),side=(halton(k,3)-.5)*width,z=(halton(k,5)-.5)*depth
                pts.push(new THREE.Vector3(ax+dx*t+nx*side,ay+dy*t+ny*side,z))
              }
            }
            const top=Math.round(BODY_COUNT*.22),diag=Math.round(BODY_COUNT*.43),base=BODY_COUNT-top-diag
            addStroke(top,-1.35,2.05,1.10,2.05,.62,.92,0)
            addStroke(diag,1.18,1.88,-1.25,-1.72,.68,.92,10000)
            addStroke(base,-1.30,-2.05,1.35,-2.05,.62,.92,20000)
            if(pts.length!==BODY_COUNT)throw new Error('Digit 2 skeleton count mismatch: '+pts.length+' / '+BODY_COUNT)
            return pts
          }"""
          digit = '\n'.join(line[10:] if line.startswith('          ') else line for line in digit.splitlines())
          s = s[:start] + digit + s[end:]
          old = 'const sphereCenters=makeBodyCenters(),digitOneCenters=makeDigitOneCenters(),centers=sphereCenters.map(p=>p.clone())'
          new = 'const sphereCenters=makeBodyCenters(),digitTwoCenters=makeDigitTwoCenters(),centers=sphereCenters.map(p=>p.clone())'
          if old not in s:
              raise SystemExit('STOP: digit 1 centers anchor not found')
          s = s.replace(old,new,1)
          if 'digitOneCenters[i]' not in s:
              raise SystemExit('STOP: digit 1 morph anchor not found')
          s = s.replace('digitOneCenters[i]','digitTwoCenters[i]',1)
          p.write_text(s)
          PY
      - name: Install and build before commit
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Commit digit 2 test
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Test 300-ball digit 2 skeleton"
          git push origin HEAD:entity-digit-2-test-v1
