name: Build EMAE 300-ball symbol
on:
  push:
    branches: [entity-emae-logo-test-v1]
    paths: [.github/workflows/entity-emae-symbol-balls-v1.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-emae-logo-test-v1
          fetch-depth: 0
      - name: Refine validated EMAE symbol skeleton only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js'); s=p.read_text()
          start=s.index('function makeEmaeLogoCenters(){')
          end=s.index('\n\nconst personality=',start)
          fn="""function makeEmaeLogoCenters(){
            const pts=[]
            function halton(i,b){let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b)}return r}
            function addBranch(count,side,offset){
              for(let i=0;i<count;i++){
                const k=i+1+offset,t=halton(k,2),u=halton(k,3)-.5,v=halton(k,5)-.5
                const y=-2.15+t*4.20
                const center=.48+1.55*Math.pow(1-t,1.45)+.18*Math.sin(Math.PI*t)
                const width=.34+.34*Math.pow(1-t,.85)
                const x=side*(center+u*width)
                const z=v*(.92-.20*t)
                pts.push(new THREE.Vector3(x,y,z))
              }
            }
            function addDot(count,cx,cy,offset){
              for(let i=0;i<count;i++){
                const k=i+1+offset,a=halton(k,2)*Math.PI*2,z0=halton(k,3)*2-1,r=.34*Math.cbrt(halton(k,5)),q=Math.sqrt(Math.max(0,1-z0*z0))
                pts.push(new THREE.Vector3(cx+r*q*Math.cos(a),cy+r*z0,r*q*Math.sin(a)))
              }
            }
            const dots=30,branches=BODY_COUNT-dots,left=Math.floor(branches/2),right=branches-left
            addBranch(left,-1,0)
            addBranch(right,1,10000)
            addDot(15,-.62,2.82,20000)
            addDot(15,.62,2.82,30000)
            if(pts.length!==BODY_COUNT)throw new Error('EMAE symbol skeleton count mismatch: '+pts.length+' / '+BODY_COUNT)
            return pts
          }"""
          fn='\n'.join(line[10:] if line.startswith('          ') else line for line in fn.splitlines())
          s=s[:start]+fn+s[end:]
          p.write_text(s)
          PY
      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Commit symbol refinement
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Refine EMAE logo skeleton silhouette"
          git push origin HEAD:entity-emae-logo-test-v1
