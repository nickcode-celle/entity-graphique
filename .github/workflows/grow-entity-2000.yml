name: Grow ENTITY 2000 test

on:
  push:
    branches:
      - entity-double-helix-test-v1
    paths:
      - '.github/workflows/grow-entity-2000.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0

      - name: Grow ENTITY sphere with population
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/main-entity-50.js'); s=p.read_text(); s=s.replace('function makeBodyCenters(){\n  const p=[new THREE.Vector3()]','function makeBodyCenters(){\n  const populationScale=Math.cbrt(BODY_COUNT/200)\n  const p=[new THREE.Vector3()]',1); s=s.replace('fibonacciShell(120,.95,','fibonacciShell(120,.95*populationScale,',1); s=s.replace('fibonacciShell(320,1.58,','fibonacciShell(320,1.58*populationScale,',1); s=s.replace('fibonacciShell(560,2.18,','fibonacciShell(560,2.18*populationScale,',1); s=s.replace('fibonacciShell(999,2.82,','fibonacciShell(999,2.82*populationScale,',1); assert 'const populationScale=Math.cbrt(BODY_COUNT/200)' in s; p.write_text(s)"

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Scale ENTITY radius with 2000-ball population"
          git push origin HEAD:entity-double-helix-test-v1
