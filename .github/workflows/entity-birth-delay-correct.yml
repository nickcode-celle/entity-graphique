name: Correct 10 second birth delay
on:
  push:
    branches: [entity-new-marble-birth-sphere-v1]
    paths: ['.github/workflows/entity-birth-delay-correct.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-new-marble-birth-sphere-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact 10 second delay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          old='''function updateNewMarbleBirth(now){\n  const t=now-birthStart\n  // The marble does not exist visually before the light point bursts.\n  birthMarble.visible=t>=1.8\n  if(t<1.8){'''
          new='''function updateNewMarbleBirth(now){\n  const t=now-birthStart-10\n  // For the first 10 seconds: ENTITY alone, no light and no marble.\n  birthMarble.visible=t>=1.8\n  if(t<0){\n    birthPoint.visible=false\n    birthLight.intensity=0\n    birthBurstMaterial.opacity=0\n    birthMarble.visible=false\n    return\n  }\n  if(t<1.8){'''
          if old not in s:
              raise SystemExit('STOP: exact birth function anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Verify exact delay
        run: |
          grep -F 'const t=now-birthStart-10' src/main-entity-50.js
          grep -F 'if(t<0)' src/main-entity-50.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m 'Correct 10 second birth delay'
          git push origin HEAD:entity-new-marble-birth-sphere-v1
