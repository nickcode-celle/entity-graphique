name: Tune newborn marble reflective gold
on:
  push:
    branches: [entity-new-marble-birth-sphere-v1]
    paths: ['.github/workflows/entity-birth-real-gold-material.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-new-marble-birth-sphere-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Change newborn material only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          old='const birthMarbleMaterial=new THREE.MeshStandardMaterial({color:0xffd700,metalness:.82,roughness:.20,emissive:0xffb000,emissiveIntensity:.22})'
          new='const birthMarbleMaterial=new THREE.MeshStandardMaterial({color:0xffd700,metalness:1,roughness:.16,emissive:0x000000,emissiveIntensity:0})'
          if old not in s:
              raise SystemExit('STOP: exact current newborn material not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Verify exact material
        run: grep -F 'color:0xffd700,metalness:1,roughness:.16,emissive:0x000000,emissiveIntensity:0' src/main-entity-50.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m 'Render newborn marble as reflective gold'
          git push origin HEAD:entity-new-marble-birth-sphere-v1
