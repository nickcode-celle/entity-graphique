name: Build 300-ball digit 4 skeleton test
on:
  push:
    branches: [entity-digit-4-test-v1]
    paths: [.github/workflows/entity-digit-4-test.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-digit-4-test-v1
          fetch-depth: 0
      - name: Replace digit 3 skeleton with digit 4 skeleton only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js'); s=p.read_text()
          start=s.index('function makeDigitThreeCenters(){'); end=s.index('\n\nconst personality=',start)
          digit="""function makeDigitFourCenters(){
            const pts=[]
            function halton(i,b){let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b)}return r}
            function addStroke(count,ax,ay,bx,by,width,depth,offset){
              const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len
              for(let i=0;i<count;i++){const k=i+1+offset,t=halton(k,2),side=(halton(k,3)-.5)*width,z=(halton(k,5)-.5)*depth;pts.push(new THREE.Vector3(ax+dx*t+nx*side,ay+dy*t+ny*side,z))}
            }
            const diag=Math.round(BODY_COUNT*.32),bar=Math.round(BODY_COUNT*.28),stem=BODY_COUNT-diag-bar
            addStroke(diag,-1.28,.18,.42,2.48,.64,.92,0)
            addStroke(bar,-1.30,.05,1.34,.05,.62,.92,10000)
            addStroke(stem,.48,2.48,.48,-2.28,.66,.92,20000)
            if(pts.length!==BODY_COUNT)throw new Error('Digit 4 skeleton count mismatch: '+pts.length+' / '+BODY_COUNT)
            return pts
          }"""
          digit='\n'.join(line[10:] if line.startswith('          ') else line for line in digit.splitlines())
          s=s[:start]+digit+s[end:]
          old='const sphereCenters=makeBodyCenters(),digitThreeCenters=makeDigitThreeCenters(),centers=sphereCenters.map(p=>p.clone())'
          new='const sphereCenters=makeBodyCenters(),digitFourCenters=makeDigitFourCenters(),centers=sphereCenters.map(p=>p.clone())'
          if old not in s: raise SystemExit('STOP: digit 3 centers anchor not found')
          s=s.replace(old,new,1)
          if 'digitThreeCenters[i]' not in s: raise SystemExit('STOP: digit 3 morph anchor not found')
          s=s.replace('digitThreeCenters[i]','digitFourCenters[i]',1)
          p.write_text(s)
          PY
      - name: Install and build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Commit digit 4 test
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Test 300-ball digit 4 skeleton"
          git push origin HEAD:entity-digit-4-test-v1
