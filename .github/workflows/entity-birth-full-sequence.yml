name: Full newborn marble integration sequence
on:
  push:
    branches: [entity-new-marble-birth-sphere-v1]
    paths:
      - '.github/workflows/entity-birth-full-sequence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-new-marble-birth-sphere-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact full birth sequence patch
        run: python3 tools/patch_birth_full_sequence.py
      - run: npm install
      - run: npm run build
      - name: Verify integration anchors
        run: |
          grep -F 'BASE_BODY_COUNT=200,BODY_COUNT=201,NEW_BALL_INDEX=200' src/main-entity-50.js
          grep -F 'entityGroup.attach(birthMarble)' src/main-entity-50.js
          grep -F 'birthMarbleMaterial.envMap=null' src/main-entity-50.js
          grep -F 'Math.cbrt(BODY_COUNT/BASE_BODY_COUNT)' src/main-entity-50.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m 'Integrate newborn marble into ENTITY'
          git push origin HEAD:entity-new-marble-birth-sphere-v1
