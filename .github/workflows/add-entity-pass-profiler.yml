name: Build 1000-ball gorilla

on:
  push:
    branches:
      - entity-double-helix-test-v1
    paths:
      - .github/workflows/add-entity-pass-profiler.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0
      - name: Build large spaced gorilla with existing ENTITY skeleton method
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main-entity-50.js')
          s=p.read_text()

          s=re.sub(r"renderer\.shadowMap\.autoUpdate=false\nlet shadowRenderMs=0,shadowProfileFrames=0\nconst shadowProfileLabel=.*?setInterval\(\(\)=>\{const n=Math\.max\(1,shadowProfileFrames\);shadowProfileLabel\.textContent='SHADOW COST '\+\(shadowRenderMs/n\)\.toFixed\(2\)\+' ms';shadowRenderMs=0;shadowProfileFrames=0\},500\)\n",'',s,flags=re.S)
          s=s.replace("scene.background=(transition.state==='returning'||transition.state==='done')?null:baseBackground;camera.layers.set(0);camera.layers.enable(bloomLayer);renderer.shadowMap.needsUpdate=true;const shadowStart=performance.now();const finalStart=shadowStart;finalComposer.render(dt);shadowRenderMs+=performance.now()-shadowStart;shadowProfileFrames++;",
                      "scene.background=(transition.state==='returning'||transition.state==='done')?null:baseBackground;camera.layers.set(0);camera.layers.enable(bloomLayer);const finalStart=performance.now();finalComposer.render(dt);")

          s=s.replace('let batchSyncMs=0\n','')
          s=s.replace('  const t=performance.now()\n','',1)
          s=s.replace('  batchSyncMs=performance.now()-t\n','',1)
          s=re.sub(r"const batchSyncLabel=document\.createElement\('div'\).*?setInterval\(\(\)=>\{batchSyncLabel\.textContent='BATCH SYNC '\+batchSyncMs\.toFixed\(2\)\+' ms'\},500\)\n",'',s,flags=re.S)

          s=s.replace('const BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:2000,','const BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:1000,',1)

          start=s.index('function makeGorillaCenters(){')
          end=s.index('\n\nconst personality=',start)
          gorilla="""function makeGorillaCenters(){
            const pts=[],S=1.58
            function addEllipsoidSurface(count,cx,cy,cz,rx,ry,rz,rotZ=0,phase=0){
              const c=Math.cos(rotZ),sn=Math.sin(rotZ)
              for(let i=0;i<count;i++){
                const y=1-(i+.5)*(2/count),rr=Math.sqrt(Math.max(0,1-y*y)),a=i*goldenAngle+phase
                const x=rx*rr*Math.cos(a),yy=ry*y,z=rz*rr*Math.sin(a)
                const xx=x*c-yy*sn,yyy=x*sn+yy*c
                pts.push(new THREE.Vector3((cx+xx)*S,(cy+yyy)*S,(cz+z)*S))
              }
            }
            addEllipsoidSurface(210,0,.15,0,1.35,1.45,.82,0,.10)
            addEllipsoidSurface(70,-1.38,1.05,0,1.05,.90,.76,-.18,.35)
            addEllipsoidSurface(70,1.38,1.05,0,1.05,.90,.76,.18,.70)
            addEllipsoidSurface(80,0,-1.05,.05,1.20,.72,.76,0,1.05)
            addEllipsoidSurface(90,0,2.12,-.02,.78,.86,.70,0,1.40)
            addEllipsoidSurface(40,0,1.78,.62,.58,.42,.55,0,1.75)
            addEllipsoidSurface(85,-2.00,.15,.03,.70,1.18,.62,-.22,2.10)
            addEllipsoidSurface(85,2.00,.15,.03,.70,1.18,.62,.22,2.45)
            addEllipsoidSurface(65,-2.38,-1.25,.28,.64,1.08,.62,-.08,2.80)
            addEllipsoidSurface(65,2.38,-1.25,.28,.64,1.08,.62,.08,3.15)
            addEllipsoidSurface(45,-.72,-1.90,.02,.68,.82,.70,0,3.50)
            addEllipsoidSurface(45,.72,-1.90,.02,.68,.82,.70,0,3.85)
            addEllipsoidSurface(25,-.82,-2.58,.48,.78,.34,1.00,0,4.20)
            addEllipsoidSurface(25,.82,-2.58,.48,.78,.34,1.00,0,4.55)
            if(pts.length!==BODY_COUNT)throw new Error('Gorilla skeleton count mismatch: '+pts.length+' / '+BODY_COUNT)
            return pts
          }"""
          gorilla='\n'.join(line[10:] if line.startswith('          ') else line for line in gorilla.splitlines())
          s=s[:start]+gorilla+s[end:]
          s=s.replace('const sphereCenters=makeBodyCenters(),gorillaCenters=sphereCenters,centers=sphereCenters.map(p=>p.clone())',
                      'const sphereCenters=makeBodyCenters(),gorillaCenters=makeGorillaCenters(),centers=sphereCenters.map(p=>p.clone())',1)

          p.write_text(s)
          PY
      - name: Install and build before commit
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Commit gorilla
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Build large spaced 1000-ball gorilla"
          git push origin HEAD:entity-double-helix-test-v1
