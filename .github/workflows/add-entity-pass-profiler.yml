name: Fix 1000-ball gorilla count

on:
  push:
    branches:
      - entity-double-helix-test-v1
    paths:
      - .github/workflows/add-entity-pass-profiler.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0
      - name: Correct gorilla skeleton count only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          old="addEllipsoidSurface(45,3.02,-2.48,.42,.68,.42,.72,0,5.25)"
          new="addEllipsoidSurface(40,3.02,-2.48,.42,.68,.42,.72,0,5.25)"
          if old not in s:
              raise SystemExit('STOP: gorilla hand count anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install and build before commit
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Commit exact 1000-ball count
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Fix gorilla skeleton to exactly 1000 balls"
          git push origin HEAD:entity-double-helix-test-v1
