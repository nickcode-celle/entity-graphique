name: Optimize ENTITY bloom layer only

on:
  push:
    branches:
      - entity-double-helix-test-v1
    paths:
      - .github/workflows/add-entity-pass-profiler.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0
      - name: Restrict bloom render to bloom layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          anchor="const bloomLayer=1\nconst bloomComposer=new EffectComposer(renderer)\n"
          replacement="const bloomLayer=1\nconst bloomCameraLayers=camera.layers.mask\nconst bloomComposer=new EffectComposer(renderer)\n"
          if anchor not in s or 'bloomCameraLayers' in s:
              raise SystemExit('STOP: bloom setup anchor unavailable or already optimized')
          s=s.replace(anchor,replacement,1)
          old='bloomComposer.render();const tb1=performance.now();bloomMs+=tb1-tb0;finalComposer.render();'
          new='camera.layers.set(bloomLayer);bloomComposer.render();camera.layers.mask=bloomCameraLayers;const tb1=performance.now();bloomMs+=tb1-tb0;finalComposer.render();'
          if old not in s:
              raise SystemExit('STOP: bloom render anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install and build before commit
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Render bloom pass on bloom layer only"
          git push origin HEAD:entity-double-helix-test-v1
