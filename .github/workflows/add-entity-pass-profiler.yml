name: Add ENTITY render-pass profiler

on:
  push:
    branches:
      - entity-double-helix-test-v1
    paths:
      - .github/workflows/add-entity-pass-profiler.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0
      - name: Add scene complexity measurements without changing rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main-entity-50.js')
          s = p.read_text()
          anchor = "window.parent?.postMessage({type:'ENTITY_TRANSITION_READY'},'*')\n"
          insert = "const complexity={meshes:0,geometries:new Set(),materials:new Set(),triangles:0};scene.traverse(o=>{if(!o.isMesh)return;complexity.meshes++;if(o.geometry){complexity.geometries.add(o.geometry.uuid);const g=o.geometry;if(g.index)complexity.triangles+=g.index.count/3;else if(g.attributes&&g.attributes.position)complexity.triangles+=g.attributes.position.count/3}const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats)if(m)complexity.materials.add(m.uuid)});const complexityLabel=document.createElement('div');Object.assign(complexityLabel.style,{position:'fixed',right:'14px',top:'260px',zIndex:9999,color:'#fff',background:'rgba(0,0,0,.68)',padding:'8px 10px',font:'12px/1.45 monospace',whiteSpace:'pre',pointerEvents:'none'});complexityLabel.textContent='SCENE COMPLEXITY\\nmeshes '+complexity.meshes+'\\ngeometries '+complexity.geometries.size+'\\nmaterials '+complexity.materials.size+'\\ntriangles '+Math.round(complexity.triangles).toLocaleString('fr-FR');document.body.appendChild(complexityLabel);\n"
          if anchor not in s:
              raise SystemExit('STOP: complexity anchor not found')
          if 'SCENE COMPLEXITY' in s:
              raise SystemExit('STOP: complexity profiler already present')
          s = s.replace(anchor, anchor + insert, 1)
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Measure ENTITY scene complexity"
          git push origin HEAD:entity-double-helix-test-v1
