name: Profile ENTITY shadow cost

on:
  push:
    branches:
      - entity-double-helix-test-v1
    paths:
      - .github/workflows/add-entity-pass-profiler.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0
      - name: Add shadow cost profiler without changing rendered output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          if 'SHADOW COST' in s:
              raise SystemExit('STOP: shadow profiler already present')
          anchor="renderer.shadowMap.type=THREE.PCFSoftShadowMap\n"
          if anchor not in s:
              raise SystemExit('STOP: shadow renderer anchor not found')
          addition="""renderer.shadowMap.autoUpdate=false
          let shadowRenderMs=0,shadowProfileFrames=0
          const shadowProfileLabel=document.createElement('div')
          Object.assign(shadowProfileLabel.style,{position:'fixed',right:'14px',top:'470px',zIndex:9999,color:'#fff',background:'rgba(0,0,0,.68)',padding:'6px 8px',font:'12px/1.4 monospace',pointerEvents:'none'})
          shadowProfileLabel.textContent='SHADOW COST'
          document.body.appendChild(shadowProfileLabel)
          setInterval(()=>{const n=Math.max(1,shadowProfileFrames);shadowProfileLabel.textContent='SHADOW COST '+(shadowRenderMs/n).toFixed(2)+' ms';shadowRenderMs=0;shadowProfileFrames=0},500)
          """
          s=s.replace(anchor,anchor+addition,1)
          render_anchor="scene.background=(transition.state==='returning'||transition.state==='done')?null:baseBackground;camera.layers.set(0);camera.layers.enable(bloomLayer);const finalStart=performance.now();finalComposer.render(dt);"
          if render_anchor not in s:
              raise SystemExit('STOP: final render anchor not found')
          replacement="scene.background=(transition.state==='returning'||transition.state==='done')?null:baseBackground;camera.layers.set(0);camera.layers.enable(bloomLayer);renderer.shadowMap.needsUpdate=true;const shadowStart=performance.now();const finalStart=shadowStart;finalComposer.render(dt);shadowRenderMs+=performance.now()-shadowStart;shadowProfileFrames++;"
          s=s.replace(render_anchor,replacement,1)
          p.write_text(s)
          PY
      - name: Install and build before commit
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Commit shadow profiler
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Profile exact ENTITY shadow render cost"
          git push origin HEAD:entity-double-helix-test-v1
