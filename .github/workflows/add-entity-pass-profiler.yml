name: Set optimized ENTITY to 1000 balls

on:
  push:
    branches:
      - entity-double-helix-test-v1
    paths:
      - .github/workflows/add-entity-pass-profiler.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0
      - name: Set population to 1000
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          old='const BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:760,SATELLITE_COUNT=5,LEVEL=.50,CAPACITES=.50'
          new='const BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:1000,SATELLITE_COUNT=5,LEVEL=.50,CAPACITES=.50'
          if old not in s:
              raise SystemExit('STOP: current 760 default not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Set optimized ENTITY test to 1000 balls"
          git push origin HEAD:entity-double-helix-test-v1
