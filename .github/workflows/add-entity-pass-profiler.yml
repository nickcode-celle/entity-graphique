name: Add ENTITY render-pass profiler

on:
  push:
    branches:
      - entity-double-helix-test-v1
    paths:
      - .github/workflows/add-entity-pass-profiler.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0
      - name: Instrument composer passes without changing rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          anchor="finalComposer.addPass(new OutputPass())\n"
          insert="""const passProfile={bloomRender:0,bloomEffect:0,finalRender:0,finalMix:0,finalOutput:0,samples:0,last:performance.now()};function measurePass(pass,key){const original=pass.render.bind(pass);pass.render=function(...args){const t=performance.now();const result=original(...args);passProfile[key]+=performance.now()-t;return result}}measurePass(bloomComposer.passes[0],'bloomRender');measurePass(bloomComposer.passes[1],'bloomEffect');measurePass(finalComposer.passes[0],'finalRender');measurePass(finalComposer.passes[1],'finalMix');measurePass(finalComposer.passes[2],'finalOutput');const passProfileLabel=document.createElement('div');Object.assign(passProfileLabel.style,{position:'fixed',right:'14px',top:'150px',zIndex:9999,color:'#fff',background:'rgba(0,0,0,.68)',padding:'8px 10px',font:'12px/1.45 monospace',whiteSpace:'pre',pointerEvents:'none'});document.body.appendChild(passProfileLabel);setInterval(()=>{const n=Math.max(1,passProfile.samples);passProfileLabel.textContent='RENDER PASSES\\nbloom scene '+(passProfile.bloomRender/n).toFixed(2)+' ms\\nbloom effect '+(passProfile.bloomEffect/n).toFixed(2)+' ms\\nfinal scene '+(passProfile.finalRender/n).toFixed(2)+' ms\\nmix '+(passProfile.finalMix/n).toFixed(2)+' ms\\noutput '+(passProfile.finalOutput/n).toFixed(2)+' ms';passProfile.bloomRender=passProfile.bloomEffect=passProfile.finalRender=passProfile.finalMix=passProfile.finalOutput=0;passProfile.samples=0},1000)
"""
          if anchor not in s:
              raise SystemExit('STOP: composer anchor not found')
          s=s.replace(anchor,anchor+insert,1)
          old="function animate(){requestAnimationFrame(animate);const frameStart=performance.now();"
          new="function animate(){requestAnimationFrame(animate);passProfile.samples++;const frameStart=performance.now();"
          if old not in s:
              raise SystemExit('STOP: profiler animate anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Measure individual ENTITY render passes"
          git push origin HEAD:entity-double-helix-test-v1
