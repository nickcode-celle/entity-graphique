name: Set ENTITY default 750

on:
  push:
    branches: [entity-double-helix-test-v1]
    paths: [.github/workflows/set-entity-default-750.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0
      - name: Set default population to 750
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          old="const BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:500,SATELLITE_COUNT=5,LEVEL=.50,CAPACITES=.50"
          new="const BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:750,SATELLITE_COUNT=5,LEVEL=.50,CAPACITES=.50"
          if old not in s:
              raise SystemExit('STOP: default BODY_COUNT selector not found')
          p.write_text(s.replace(old,new,1))

          h=Path('capacity-test.html')
          hs=h.read_text()
          oldh="n=Number(q.get('balls'))||500"
          newh="n=Number(q.get('balls'))||750"
          if oldh not in hs:
              raise SystemExit('STOP: capacity page default not found')
          h.write_text(hs.replace(oldh,newh,1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js capacity-test.html
          git commit -m "Set ENTITY capacity test default to 750 balls"
          git push origin HEAD:entity-double-helix-test-v1
