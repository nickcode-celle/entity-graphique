name: Fix newborn marble visible position
on:
  push:
    branches: [entity-new-marble-birth-sphere-v1]
    paths: [.github/workflows/entity-birth-position-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-new-marble-birth-sphere-v1
          fetch-depth: 0
      - name: Move fixed birth point beside ENTITY
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          old='const birthPosition=new THREE.Vector3(72,8,18)'
          new='const birthPosition=new THREE.Vector3(128,18,48)'
          if old not in s: raise SystemExit('birthPosition anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build
        run: npm install --no-package-lock --no-audit --no-fund && npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Place newborn marble visibly beside ENTITY"
          git push origin HEAD:entity-new-marble-birth-sphere-v1
