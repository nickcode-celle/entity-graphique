name: Apply Gorilla 2000 test

on:
  push:
    branches: [entity-double-helix-test-v1]
    paths: [.github/workflows/apply-gorilla-2000.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-double-helix-test-v1
          fetch-depth: 0

      - name: Patch ENTITY to 2000-ball gorilla skeleton
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/main-entity-50.js')
          s=p.read_text()

          old_count="const BODY_COUNT=200,SATELLITE_COUNT=5,LEVEL=.50,CAPACITES=.50"
          new_count="const BODY_COUNT=2000,SATELLITE_COUNT=5,LEVEL=.50,CAPACITES=.50"

          old_body="function makeBodyCenters(){const p=[new THREE.Vector3()];p.push(...fibonacciShell(12,.95,.18,new THREE.Vector3(.22,-.14,.31)),...fibonacciShell(32,1.58,1.07,new THREE.Vector3(-.31,.27,.11)),...fibonacciShell(56,2.18,2.16,new THREE.Vector3(.17,.39,-.26)),...fibonacciShell(99,2.82,2.91,new THREE.Vector3(-.21,-.28,.37)));return p}"
          new_body="""function makeBodyCenters(){
            const p=[new THREE.Vector3()]
            p.push(
              ...fibonacciShell(120,.95,.18,new THREE.Vector3(.22,-.14,.31)),
              ...fibonacciShell(320,1.58,1.07,new THREE.Vector3(-.31,.27,.11)),
              ...fibonacciShell(560,2.18,2.16,new THREE.Vector3(.17,.39,-.26)),
              ...fibonacciShell(999,2.82,2.91,new THREE.Vector3(-.21,-.28,.37))
            )
            return p
          }"""

          old_shape="function makeTorusCenters(){const pts=[],major=1.95,minor=.72,majorSteps=20,minorSteps=10;for(let u=0;u<majorSteps;u++)for(let v=0;v<minorSteps;v++){const a=u/majorSteps*Math.PI*2,b=v/minorSteps*Math.PI*2+(u%2)*Math.PI/minorSteps,r=major+minor*Math.cos(b);pts.push(new THREE.Vector3(r*Math.cos(a),minor*Math.sin(b),r*Math.sin(a)))}return pts}"
          new_shape="""function makeGorillaCenters(){
            const pts=[]
            let seed=1
            const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
            function addEllipsoid(count,cx,cy,cz,rx,ry,rz,rotZ=0){
              const c=Math.cos(rotZ),sn=Math.sin(rotZ)
              for(let i=0;i<count;i++){
                const z=rand()*2-1,a=rand()*Math.PI*2,rr=Math.sqrt(1-z*z),r=Math.cbrt(rand())
                const x=rx*r*rr*Math.cos(a),y=ry*r*z,zz=rz*r*rr*Math.sin(a)
                const xx=x*c-y*sn,yy=x*sn+y*c
                pts.push(new THREE.Vector3(cx+xx,cy+yy,cz+zz))
              }
            }
            addEllipsoid(420,0,.15,0,1.35,1.45,.82)
            addEllipsoid(140,-1.38,1.05,0,1.05,.90,.76,-.18)
            addEllipsoid(140, 1.38,1.05,0,1.05,.90,.76, .18)
            addEllipsoid(160,0,-1.05,.05,1.20,.72,.76)
            addEllipsoid(180,0,2.12,-.02,.78,.86,.70)
            addEllipsoid(80,0,1.78,.62,.58,.42,.55)
            addEllipsoid(170,-2.00,.15,.03,.70,1.18,.62,-.22)
            addEllipsoid(170, 2.00,.15,.03,.70,1.18,.62, .22)
            addEllipsoid(130,-2.38,-1.25,.28,.64,1.08,.62,-.08)
            addEllipsoid(130, 2.38,-1.25,.28,.64,1.08,.62, .08)
            addEllipsoid(90,-.72,-1.90,.02,.68,.82,.70)
            addEllipsoid(90, .72,-1.90,.02,.68,.82,.70)
            addEllipsoid(50,-.82,-2.58,.48,.78,.34,1.00)
            addEllipsoid(50, .82,-2.58,.48,.78,.34,1.00)
            return pts
          }"""

          old_target="""const sphereCenters=makeBodyCenters(),torusCenters=makeTorusCenters(),centers=sphereCenters.map(p=>p.clone())
          const TORUS_MORPH_START=1,TORUS_MORPH_DURATION=3
          function updateSkeletonMorph(){const t=THREE.MathUtils.clamp((elapsed-TORUS_MORPH_START)/TORUS_MORPH_DURATION,0,1),s=t*t*(3-2*t);for(let i=0;i<BODY_COUNT;i++)centers[i].lerpVectors(sphereCenters[i],torusCenters[i],s);updateCells()}"""
          new_target="""const sphereCenters=makeBodyCenters(),gorillaCenters=makeGorillaCenters(),centers=sphereCenters.map(p=>p.clone())
          const GORILLA_MORPH_START=1,GORILLA_MORPH_DURATION=3
          function updateSkeletonMorph(){const t=THREE.MathUtils.clamp((elapsed-GORILLA_MORPH_START)/GORILLA_MORPH_DURATION,0,1),s=t*t*(3-2*t);for(let i=0;i<BODY_COUNT;i++)centers[i].lerpVectors(sphereCenters[i],gorillaCenters[i],s);updateCells()}"""

          for label,old in [('BODY_COUNT',old_count),('makeBodyCenters',old_body),('torus shape',old_shape),('morph target',old_target)]:
            if old not in s:
              raise SystemExit(f'STOP: expected {label} block not found; no file written')

          s=s.replace(old_count,new_count).replace(old_body,new_body).replace(old_shape,new_shape).replace(old_target,new_target)
          p.write_text(s)
          print('Patched ENTITY: 2000 balls -> gorilla skeleton')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m "Test ENTITY 2000 ball gorilla skeleton"
          git push origin HEAD:entity-double-helix-test-v1
