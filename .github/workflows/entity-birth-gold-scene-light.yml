name: Render newborn gold with ENTITY lighting
on:
  push:
    branches: [entity-new-marble-birth-sphere-v1]
    paths: ['.github/workflows/entity-birth-gold-scene-light.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-new-marble-birth-sphere-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tune newborn gold material only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          old='const birthMarbleMaterial=new THREE.MeshStandardMaterial({color:0xffd84a,metalness:.42,roughness:.20,emissive:0x6b4700,emissiveIntensity:.12})'
          new='const birthMarbleMaterial=new THREE.MeshStandardMaterial({color:0xffd84a,metalness:.38,roughness:.24,emissive:0xffc21a,emissiveIntensity:.10})'
          if old not in s:
              raise SystemExit('STOP: exact current newborn material anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Verify exact material
        run: grep -F 'color:0xffd84a,metalness:.38,roughness:.24,emissive:0xffc21a,emissiveIntensity:.10' src/main-entity-50.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m 'Tune newborn gold for ENTITY lighting'
          git push origin HEAD:entity-new-marble-birth-sphere-v1
