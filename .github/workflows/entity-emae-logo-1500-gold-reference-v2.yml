name: EMAE 1500 gold from validated references
on:
  push:
    branches: [entity-emae-logo-1500-gold-reference-v2]
    paths: ['.github/workflows/entity-emae-logo-1500-gold-reference-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: entity-emae-logo-1500-gold-reference-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply only validated logo geometry scaling and validated gold render
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main-entity-50.js')
          s=p.read_text()
          def one(old,new,label):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'STOP: {label} anchor count={s.count(old)}')
              s=s.replace(old,new,1)
          one("import {OutputPass} from 'three/addons/postprocessing/OutputPass.js'\n", "import {OutputPass} from 'three/addons/postprocessing/OutputPass.js'\nimport {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js'\n", 'RoomEnvironment import')
          one("const TEST_COUNTS=[300,500,750,760,775,800,875,1000,1500,2000];const requestedCount=Number(new URLSearchParams(location.search).get('balls'));const BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:300,SATELLITE_COUNT=5,LEVEL=.50,CAPACITES=.50", "const TEST_COUNTS=[300,500,750,760,775,800,875,1000,1500,2000];const requestedCount=Number(new URLSearchParams(location.search).get('balls'));const BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:1500,SATELLITE_COUNT=5,LEVEL=.50,CAPACITES=.50", 'default 1500')
          one("app.appendChild(renderer.domElement)\n\nconst scene=new THREE.Scene()", "app.appendChild(renderer.domElement)\nconst emaeGoldPMREM=new THREE.PMREMGenerator(renderer)\nconst emaeGoldEnv=emaeGoldPMREM.fromScene(new RoomEnvironment(),.04).texture\nemaeGoldPMREM.dispose()\n\nconst scene=new THREE.Scene()", 'validated gold environment')
          one("const sphereCenters=makeBodyCenters(),emaeLogoCenters=makeEmaeLogoCenters(),centers=sphereCenters.map(p=>p.clone())", "const sphereCenters=makeBodyCenters(),emaeLogoScale=Math.sqrt(BODY_COUNT/300),emaeLogoCenters=makeEmaeLogoCenters().map(p=>p.multiplyScalar(emaeLogoScale)),centers=sphereCenters.map(p=>p.clone())", 'logo density scaling')
          old="if(t>=1){const tierGreen=new THREE.Color(0x28c95b);for(let i=0;i<BODY_COUNT;i++){marbles[i].material.color.copy(tierGreen);marbles[i].material.needsUpdate=true}}"
          new="if(t>=1){const gold=new THREE.Color(0xffc928);for(let i=0;i<BODY_COUNT;i++){const o=marbles[i];o.material.color.copy(gold);o.material.metalness=.92;o.material.roughness=.20;o.material.envMap=emaeGoldEnv;o.material.envMapIntensity=1.55;o.material.emissive.setHex(0x000000);o.material.emissiveIntensity=0;o.material.needsUpdate=true;if(o.userData.renderBatch){const batch=o.userData.renderBatch,id=o.userData.renderBatchId;batch.setColorAt(id,gold);batch.material.metalness=.92;batch.material.roughness=.20;batch.material.envMap=emaeGoldEnv;batch.material.envMapIntensity=1.55;batch.material.emissive.setHex(0x000000);batch.material.emissiveIntensity=0;batch.material.needsUpdate=true;o.userData.renderBatchColor=gold.getHex()}}}"
          one(old,new,'post-morph validated gold')
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Verify exact references are present
        run: |
          grep -F 'BODY_COUNT=TEST_COUNTS.includes(requestedCount)?requestedCount:1500' src/main-entity-50.js
          grep -F 'emaeLogoScale=Math.sqrt(BODY_COUNT/300)' src/main-entity-50.js
          grep -F 'const left=[[-1.95,-1.78],[-2.08,-1.42]' src/main-entity-50.js
          grep -F 'dotEach=12,branchEach=(BODY_COUNT-dotEach*2)/2' src/main-entity-50.js
          grep -F 'emaeGoldEnv=emaeGoldPMREM.fromScene(new RoomEnvironment(),.04).texture' src/main-entity-50.js
          grep -F 'batch.material.metalness=.92;batch.material.roughness=.20;batch.material.envMap=emaeGoldEnv;batch.material.envMapIntensity=1.55' src/main-entity-50.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main-entity-50.js
          git commit -m 'Render 1500-ball EMAE gold from validated logo and gold references'
          git push origin HEAD:entity-emae-logo-1500-gold-reference-v2
